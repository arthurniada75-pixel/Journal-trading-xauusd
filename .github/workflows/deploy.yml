name: Publier Aurum Journal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v6

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les outils
        run: npm install

      - name: Construire le site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
